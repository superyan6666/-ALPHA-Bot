name: Build A-Share Parquet Data Lake

on:
  schedule:
    # Run at 16:00 UTC every Friday (Midnight Saturday Beijing Time)
    - cron: '0 16 * * 5'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Limit number of stocks (for testing)'
        required: false
        type: string

jobs:
  build_parquet:
    runs-on: self-hosted
    timeout-minutes: 240

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install baostock pandas pyarrow fastparquet akshare xgboost scikit-learn

    - name: Build Data Lake
      run: |
        if [ -n "${{ github.event.inputs.limit }}" ]; then
          python build_ashare_parquet.py --limit ${{ github.event.inputs.limit }}
        else
          python build_ashare_parquet.py
        fi

    - name: Build Macro Data Lake
      run: |
        python build_macro_parquet.py

    - name: Train Production XGBoost Model
      run: |
        python train_prod_model.py

    - name: Upload Parquet Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ashare-daily-parquet
        path: .quantbot_data/ashare_daily.parquet
        retention-days: 7

    - name: Upload Model Artifact
      uses: actions/upload-artifact@v4
      with:
        name: prod-xgb-model
        path: |
          .quantbot_data/prod_xgb_model_*.json
          .quantbot_data/prod_xgb_meta_*.json
        retention-days: 14
