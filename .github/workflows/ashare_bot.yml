name: Intraday Right-Side Trading Bot

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: '运行模式 (全量量化扫描 / 仅大盘体检 / 测试连通性 / 早盘快报)'
        required: true
        default: 'normal'
        type: choice
        options:
          - normal
          - market_only
          - test_conn
          - morning
      push_empty:
        description: '是否在无信号时也推送大盘状态报告？'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: self-hosted
    
    # 强行熔断时间：30分钟。给极端的网络波动和备用源优雅降级留下绝对充足的时间
    timeout-minutes: 30
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 搭建 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 缓存 pip 依赖与行情数据
        uses: actions/cache@v4
        with:
          # 【关键修复】：将历史K线目录和快照缓存一同纳入云端持久化，大幅提速并防封锁
          path: |
            ~/.cache/pip
            hist_cache/
            spot_cache.pkl
          key: ${{ runner.os }}-quant-cache-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-quant-cache-

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade akshare pandas numpy requests pytz baostock efinance tushare yfinance pyarrow xgboost scikit-learn torch

      - name: 启动监控引擎 / 测试连通性
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          ORACLE_MODE: ${{ secrets.ORACLE_MODE || 'false' }}
          HTTP_PROXY: ${{ secrets.HTTP_PROXY || '' }}
          PUSH_EMPTY_RESULT: ${{ inputs.push_empty == false && 'false' || 'true' }} 
          RUN_MODE: ${{ inputs.run_mode || 'normal' }}
          PYTHONIOENCODING: "utf-8"
          PYTHONUNBUFFERED: "1"
        run: |
          # 自动分发调度模式
          if [ "${{ github.event.schedule }}" == "45 6 * * 1-5" ]; then
            RUN_MODE="normal"
          fi

          if [ "$RUN_MODE" == "test_conn" ]; then
            echo "🔔 检测到测试模式，执行钉钉与飞书连通性测试..."
            python test_spot_sources.py
            python main.py
          elif [ "$RUN_MODE" == "market_only" ]; then
            echo "📊 检测到大盘体检模式，开始扫描宏观资金与情绪指标..."
            python main.py
          else
            echo "🚀 预检备用数据源连通性..."
            python test_spot_sources.py || true
            echo "🚀 执行全量 A 股量化扫描..."
            python main.py
          fi

      - name: 回填信号实际收益
        if: ${{ github.event_name == 'schedule' || inputs.run_mode == 'normal' }}
        run: |
          python -c "from signal_tracker import SignalTracker; SignalTracker().backfill_outcomes()"

      - name: 保存运行状态与辅助跟踪账本
        if: ${{ github.event_name == 'schedule' || inputs.run_mode == 'normal' }} 
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "[bot] 更新推送状态、跟踪队列与信号归档"
          file_pattern: 'pushed_state.json advisory_tracker.json .quantbot_data/signal_history.jsonl'
          commit_options: '--no-verify --signoff'
