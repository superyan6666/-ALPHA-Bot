name: Intraday Right-Side Trading Bot

on:
  schedule:
    # 提前至北京时间 14:45 触发 (尾盘买入法)，预留 Github Actions 队列排队延迟
    - cron: '45 6 * * 1-5'
    # 提前至北京时间 09:35 触发 (早盘宏观与主线播报)
    - cron: '35 1 * * 1-5'
  workflow_dispatch:
    inputs:
      run_mode:
        description: '运行模式 (全量量化扫描 / 仅大盘体检 / 测试连通性 / 早盘播报)'
        required: true
        default: 'normal'
        type: choice
        options:
          - normal
          - market_only
          - test_conn
          - briefing
      push_empty:
        description: '是否在无信号时也推送大盘状态报告？'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    # 强行熔断时间：30分钟。给极端的网络波动和备用源优雅降级留下绝对充足的时间
    timeout-minutes: 30
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 搭建 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 缓存 pip 依赖与行情数据
        uses: actions/cache@v4
        with:
          # 【关键修复】：将历史K线目录和快照缓存一同纳入云端持久化，大幅提速并防封锁
          path: |
            ~/.cache/pip
            hist_cache/
            spot_cache.pkl
          key: ${{ runner.os }}-quant-cache-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-quant-cache-

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade akshare pandas numpy requests pytz baostock efinance tushare yfinance

      - name: 启动监控引擎 / 测试连通性
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          PUSH_EMPTY_RESULT: ${{ inputs.push_empty == false && 'false' || 'true' }} 
          RUN_MODE: ${{ inputs.run_mode || 'normal' }}
          PYTHONIOENCODING: "utf-8"
          PYTHONUNBUFFERED: "1"
        run: |
          # 自动分发调度模式
          if [ "${{ github.event.schedule }}" == "35 1 * * 1-5" ]; then
            RUN_MODE="briefing"
          elif [ "${{ github.event.schedule }}" == "45 6 * * 1-5" ]; then
            RUN_MODE="normal"
          fi

          if [ "$RUN_MODE" == "test_conn" ]; then
            echo "🔔 检测到测试模式，执行钉钉与飞书连通性测试..."
            python - << 'EOF'
          import os, requests, datetime
          
          def send_test(url, name):
              if not url:
                  print(f'⚠️ 未配置 {name} 环境变量')
                  return
              now = datetime.datetime.now().strftime('%Y-%m-%d %H:%M:%S')
              
              if "feishu.cn" in url or "larksuite.com" in url:
                  payload = {
                      "msg_type": "interactive",
                      "card": {
                          "header": {
                              "title": {"tag": "plain_text", "content": "🤖 AI量化引擎连通性测试"},
                              "template": "blue"
                          },
                          "elements": [{"tag": "markdown", "content": f"飞书通知链路测试成功！\n时间: {now}\n状态: GitHub Actions 触发器已打通。"}]
                      }
                  }
              else:
                  # 钉钉
                  payload = {
                      'msgtype': 'markdown',
                      'markdown': {
                          'title': '🤖 AI量化 | 连通性测试',
                          'text': f'🤖 **AI量化打板引擎** 连通性测试成功！\n\n- 时间: {now}\n- 状态: GitHub Actions 与钉钉链路畅通。'
                      }
                  }
              res = requests.post(url, json=payload, timeout=10)
              print(f'✅ {name} 推送结果:', res.text)

          send_test(os.environ.get('DINGTALK_WEBHOOK'), 'DINGTALK_WEBHOOK')
          send_test(os.environ.get('FEISHU_WEBHOOK'), 'FEISHU_WEBHOOK')
          EOF
          elif [ "$RUN_MODE" == "briefing" ]; then
            echo "📊 启动早盘宏观与热门主线播报 Agent..."
            python daily_briefing.py
          elif [ "$RUN_MODE" == "market_only" ]; then
            echo "📊 检测到大盘体检模式，开始扫描宏观资金与情绪指标..."
            python main.py
          else
            echo "🚀 执行全量 A 股量化扫描..."
            python main.py
          fi

      - name: 保存运行状态与模拟盘账本
        if: ${{ github.event_name == 'schedule' || inputs.run_mode == 'normal' }} 
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "[bot] 更新推送状态与AI模拟盘账本"
          # 【关键修复】：将新产生的 paper_trades.json 纳入自动提交，确保胜率能够跨日继承进化
          file_pattern: 'pushed_state.json paper_trades.json'
          commit_options: '--no-verify --signoff'
